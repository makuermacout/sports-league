name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Minimal rule set: syntax errors and pyflakes (unused/undefined names).
      - run: uvx ruff check --select E9,F backend/app backend/tests

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: league_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d league_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres
      - name: Unit and API tests
        run: uv run python -m pytest --ignore=tests/integration -q
      - name: Integration tests (SQLite)
        run: uv run python -m pytest tests/integration -q
      - name: Integration tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/league_test
        run: uv run python -m pytest tests/integration -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # "build" type-checks with tsc, then bundles.
      - run: npm run build

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (waits for healthchecks)
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -X POST http://localhost:8000/teams \
            -H "Content-Type: application/json" \
            -d '{"name": "CI FC"}'
          curl -fsS http://localhost:8000/teams | grep "CI FC"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
